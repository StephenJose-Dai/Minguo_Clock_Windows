# 构建民国纪年 Windows 版：x64 / x86 / ARM64 各出一个安装包 + 一个绿色版 zip
# 推送代码就会构建（在 Actions 页面下载）；推送 v 开头的标签（如 v1.0.0）会自动发布到 Releases
name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            arch: x64
          - rid: win-x86
            arch: x86
          - rid: win-arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 核心逻辑自检
        if: matrix.rid == 'win-x64'
        run: dotnet run --project tests/Minguo.Core.Check -c Release

      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          [xml]$p = Get-Content src/MinguoCalendar/MinguoCalendar.csproj
          $v = ($p.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1)
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: 发布（自包含单文件，不需要另装 .NET）
        run: >
          dotnet publish src/MinguoCalendar/MinguoCalendar.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish/${{ matrix.rid }}

      - name: 绿色版 zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath "dist/MinguoCalendar-${{ steps.ver.outputs.version }}-${{ matrix.arch }}-portable.zip"

      - name: 安装 Inno Setup
        run: choco upgrade innosetup -y --no-progress

      - name: 安装包
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DArch=${{ matrix.arch }}" "/DSourceDir=$PWD\publish\${{ matrix.rid }}" "/O$PWD\dist" installer\MinguoCalendar.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: MinguoCalendar-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
